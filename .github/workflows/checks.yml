name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install CPU test dependencies
        run: python -m pip install "numpy>=1.26" "Pillow>=10" "matplotlib>=3.8"
      - name: Run physics, rendering, and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check src scripts tests
      - name: Check command-line entry points
        run: |
          python scripts/ansys_smoke_test.py --help
          python scripts/ansys_license_probe.py --help
          python scripts/run_simulation.py --help
          python scripts/validate_simulation.py --help
          python scripts/resume_simulation.py --help
          python scripts/export_examples.py --help
          python scripts/compare_rendering.py --help
          python scripts/audit_examples.py --help
          python scripts/benchmark_projection.py --help
          python scripts/benchmark_solvers.py --help
          python scripts/render_queue.py --help
          python scripts/run_simulation.py run --config configs/material_plane_slide/soft_rubber.json --dry-run
          python scripts/validate_plane.py --help
          python scripts/validate_plane_contact.py --help
          python scripts/build_plane_adapters.py --help
          python scripts/parse_solver_monitor.py --help
          python scripts/parse_contact_tracking.py --help
          python scripts/contact_health.py --help
