name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install CPU test dependencies
        run: python -m pip install "numpy>=1.26" "Pillow>=10" "matplotlib>=3.8"
      - name: Run physics, rendering, and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check src scripts tests
      # Every launcher is checked by tests/test_entry_points.py, which runs above.
      - name: Check a shipped preset resolves without a solver
        run: python scripts/run_simulation.py run --config configs/material_plane_slide/soft_rubber.json --dry-run
